name: Open Food Facts release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation mode (fixture is upload-free; full downloads and uploads the OFF dump)'
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - full
      dataset_version:
        description: 'Optional deterministic dataset version for an operator-triggered full release'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: off-data-refresh
  cancel-in-progress: false

env:
  # Scheduled runs are always full; manual runs default to the upload-free fixture.
  OFF_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode || 'fixture' }}
  OFF_DUMP_URL: https://openfoodfacts-ds.s3.eu-west-3.amazonaws.com/openfoodfacts-products.jsonl.gz
  MIN_FREE_KB: 25000000
  # Keep full-run logs bounded while ensuring both record and wall-clock
  # telemetry is visible during slow ingestion and index phases.
  OFF_PROGRESS_RECORDS: 250000
  OFF_PROGRESS_INTERVAL_SECONDS: 30
  OFF_CHUNK_SIZE: 500000
  OFF_INDEX_MEMORY_MB: 2048
  OFF_WORKER_THREADS: 6

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Check runner disk before download
        shell: bash
        run: |
          set -euo pipefail
          free_kb="$(df -Pk "${RUNNER_TEMP}" | awk 'NR==2 {print $4}')"
          test "${free_kb}" -ge "${MIN_FREE_KB}" || {
            echo "Not enough free runner disk: ${free_kb} KB" >&2
            exit 1
          }
      - name: Download compressed official dump
        if: env.OFF_MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          command -v aria2c >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y aria2
          }
          dump="${RUNNER_TEMP}/openfoodfacts-products.jsonl.gz"
          download_dir="$(mktemp -d "${RUNNER_TEMP}/off-download.XXXXXX")"
          cleanup_download() { rm -rf -- "${download_dir}"; }
          trap cleanup_download EXIT
          aria2c \
            -x 16 \
            -s 16 \
            -k 10M \
            --max-tries 8 \
            --retry-wait 5 \
            --timeout 60 \
            --connect-timeout 30 \
            -o openfoodfacts-products.jsonl.gz \
            --dir "${download_dir}" \
            "${OFF_DUMP_URL}"
          mv "${download_dir}/openfoodfacts-products.jsonl.gz" "${dump}"
          test -s "${dump}"
          free_kb="$(df -Pk "${RUNNER_TEMP}" | awk 'NR==2 {print $4}')"
          test "${free_kb}" -ge "${MIN_FREE_KB}" || {
            echo "Download left too little free disk: ${free_kb} KB" >&2
            exit 1
          }
          echo "OFF_INPUT=${dump}" >> "${GITHUB_ENV}"
      - name: Use checked-in fixture
        if: env.OFF_MODE == 'fixture'
        shell: bash
        run: |
          set -euo pipefail
          echo 'OFF_INPUT=tests/fixtures/products.jsonl.gz' >> "${GITHUB_ENV}"
      - name: Compile optimized pipeline
        shell: bash
        run: |
          set -euo pipefail
          scripts/observe-command.sh "${RUNNER_TEMP}/off-compile.log" \
            --metrics-interval-seconds "${OFF_PROGRESS_INTERVAL_SECONDS}" -- \
            timeout --foreground --signal=TERM --kill-after=60s 30m \
            cargo build --release --locked --manifest-path Cargo.toml
      - name: Build release
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.OFF_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.OFF_SFTP_PORT }}
          SFTP_USER: ${{ secrets.OFF_SFTP_USER }}
          SFTP_PRIVATE_KEY: ${{ secrets.OFF_SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.OFF_SFTP_KNOWN_HOSTS }}
          SFTP_REMOTE_DIR: ${{ secrets.OFF_SFTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [[ "${OFF_MODE}" == fixture ]]; then
            dataset="fixture-${GITHUB_RUN_ID:-manual}"
            chunk_size=50000
            index_memory_mb=256
          else
            dataset="${{ inputs.dataset_version }}"
            [[ -n "${dataset}" ]] || dataset="$(date -u +%Y-%m-%d)"
            chunk_size="${OFF_CHUNK_SIZE}"
            index_memory_mb="${OFF_INDEX_MEMORY_MB}"
          fi
          run_key="${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}"
          output="${RUNNER_TEMP}/off-release"
          # Keep every upload name unique so a retry cannot mix a new archive
          # with an old checksum sidecar while activation is watching incoming/.
          artifact="${RUNNER_TEMP}/off-index-${dataset}-${run_key}.tar.zst"
          build_log="${RUNNER_TEMP}/off-build.log"
          status_file="${RUNNER_TEMP}/off-progress.json"
          observe_args=()
          if [[ "${OFF_MODE}" == full ]]; then
            observe_args=(--status-file "${status_file}")
          fi
          publish_status() {
            [[ "${OFF_MODE}" == full && -s "${status_file}" ]] || return 0
            scripts/publish-progress.sh "${status_file}" "$@" || {
              echo 'OFF progress status upload failed; continuing the build.' >&2
            }
          }
          terminal_status() {
            local code="$?" state=cancelled
            if [[ "$code" == 0 ]]; then
              state=success
            elif [[ "$code" != 130 && "$code" != 143 ]]; then
              state=failure
            fi
            publish_status --state "$state" --exit-code "$code"
            return "$code"
          }
          # EXIT publishes the last complete status; TERM/INT become a
          # cancellation state before EXIT runs. Publishing is best effort.
          trap terminal_status EXIT
          trap 'exit 143' TERM INT
          set +e
          scripts/observe-command.sh "${build_log}" \
            --metrics-interval-seconds "${OFF_PROGRESS_INTERVAL_SECONDS}" \
            "${observe_args[@]}" -- \
            timeout --foreground --signal=TERM --kill-after=60s 150m \
            ./target/release/off-data-pipeline build \
              --input "${OFF_INPUT}" --output "${output}" \
              --dataset-version "${dataset}" --artifact "${artifact}" \
              --chunk-size "${chunk_size}" \
              --worker-threads "${OFF_WORKER_THREADS}" \
              --index-memory-mb "${index_memory_mb}" \
              --progress-records "${OFF_PROGRESS_RECORDS}" \
              --progress-interval-seconds "${OFF_PROGRESS_INTERVAL_SECONDS}" &
          build_pid="$!"
          set -e
          if [[ "${OFF_MODE}" == full ]]; then
            while kill -0 "${build_pid}" 2>/dev/null; do
              publish_status
              sleep "${OFF_PROGRESS_INTERVAL_SECONDS}"
            done
          fi
          set +e
          wait "${build_pid}"
          build_status="$?"
          set -e
          [[ "${build_status}" -eq 0 ]] || exit "${build_status}"
          test -s "${output}/off-index-manifest.json"
          test -s "${artifact}"
          echo "OFF_RELEASE=${output}" >> "${GITHUB_ENV}"
          echo "OFF_ARTIFACT=${artifact}" >> "${GITHUB_ENV}"
          trap - EXIT TERM INT
      - name: Checksum release artifact
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${OFF_ARTIFACT}" > "${OFF_ARTIFACT}.sha256"
      - name: Summarize release counters
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/off-release/off-index-manifest.json"
          {
            echo '## Open Food Facts pipeline counters'
            echo
            if [[ -s "${manifest}" ]]; then
              echo '| Counter | Value |'
              echo '| --- | ---: |'
              jq -r '
                "| inputCompressedBytes | \(.inputCompressedBytes) |",
                "| inputLines | \(.inputLines) |",
                "| rawParsed | \(.rawParsed) |",
                "| acceptedProducts | \(.acceptedProducts) |",
                "| invalidLines | \(.invalidLines) |",
                "| skippedProducts | \(.skippedProducts) |",
                "| skippedInvalidBarcode | \(.skippedInvalidBarcode) |",
                "| skippedMissingName | \(.skippedMissingName) |",
                "| skippedMissingNutrition | \(.skippedMissingNutrition) |",
                "| skippedValidation | \(.skippedValidation) |",
                "| sortRuns | \(.sortRuns) |",
                "| dedupedDocs | \(.dedupedDocs) |",
                "| indexedDocs | \(.indexedDocs) |",
                "| recordCount | \(.recordCount) |"
              ' "${manifest}"
              if [[ -s "${OFF_ARTIFACT:-}" ]]; then
                printf '| artifactBytes | %s |\n' "$(wc -c < "${OFF_ARTIFACT}")"
              fi
            else
              echo 'Manifest was not produced; inspect the timestamped build log above.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload over restricted SFTP
        if: env.OFF_MODE == 'full'
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.OFF_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.OFF_SFTP_PORT }}
          SFTP_USER: ${{ secrets.OFF_SFTP_USER }}
          SFTP_PRIVATE_KEY: ${{ secrets.OFF_SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.OFF_SFTP_KNOWN_HOSTS }}
          SFTP_REMOTE_DIR: ${{ secrets.OFF_SFTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          test -n "${SFTP_HOST}" -a -n "${SFTP_USER}" -a -n "${SFTP_PRIVATE_KEY}" \
            -a -n "${SFTP_KNOWN_HOSTS}" -a -n "${SFTP_REMOTE_DIR}"
          test "${SFTP_REMOTE_DIR}" = /incoming || {
            echo 'SFTP_REMOTE_DIR must be /incoming inside the OFF chroot.' >&2
            exit 1
          }
          key="${RUNNER_TEMP}/off-sftp-key"
          known_hosts="${RUNNER_TEMP}/off-known-hosts"
          cleanup_sftp() { rm -f -- "${key}" "${known_hosts}"; }
          trap cleanup_sftp EXIT
          umask 077
          printf '%s\n' "${SFTP_PRIVATE_KEY}" > "${key}"
          printf '%s\n' "${SFTP_KNOWN_HOSTS}" > "${known_hosts}"
          artifact_name="$(basename "${OFF_ARTIFACT}")"
          port_args=()
          [[ -n "${SFTP_PORT:-}" ]] && port_args=(-P "${SFTP_PORT}")
          upload_suffix=".part-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}"
          sftp -i "${key}" -oIdentitiesOnly=yes -oBatchMode=yes -oStrictHostKeyChecking=yes \
            -oUserKnownHostsFile="${known_hosts}" "${port_args[@]}" "${SFTP_USER}@${SFTP_HOST}" <<SFTP
          cd ${SFTP_REMOTE_DIR}
          put ${OFF_ARTIFACT} ${artifact_name}${upload_suffix}
          put ${OFF_ARTIFACT}.sha256 ${artifact_name}.sha256${upload_suffix}
          rename ${artifact_name}${upload_suffix} ${artifact_name}
          rename ${artifact_name}.sha256${upload_suffix} ${artifact_name}.sha256
          SFTP
          cleanup_sftp
          trap - EXIT
